# V9 BIDIRECTIONAL: V8 + intra-batch first-difference smoothness, applied
# symmetrically. Each frame's pose is pulled toward both its past and its
# future neighbor within the batch. Future leaks into past during the
# simultaneous optimization -- not causal.
#
# All 17 EMDB sequences: ~90 min, mean MPJPE 63.53 (vs cached 62.52, +1.0 mm).

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 50
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 1.0
  smooth_intra: true
  smooth_intra_weight: 10.0
  smooth_causal: false       # bidirectional (symmetric) smoothness
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false
