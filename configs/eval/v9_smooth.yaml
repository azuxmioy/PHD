# V9: V8 + intra-batch temporal smoothness. Adds neighbor-frame differences
# on opt_cam/opt_orient/opt_poses to the loss, encouraging smooth trajectories.
#
# All 17 EMDB sequences: ~90 min total (negligible cost added vs V8).
# Metrics: running now, see /data/hohs2/outputs/v9_all_metrics.txt.

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 50
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 1.0
  smooth_intra: true
  smooth_intra_weight: 10.0
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false
