# V0: original batched setup. Slow + over-fits to noisy PointDiT samples
# (see V8 for the recommended replacement). Kept for reference.
#
# All 17 EMDB sequences: ~3h total, mean MPJPE 68.31 mm.

fit:
  batch_size: 64
  n_sample: 4
  # n_iter unset -> fit_batch defaults (200 when prev_params is None, 100 with).
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 0.0
  smooth_intra: false
  smooth_intra_weight: 10.0
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false
