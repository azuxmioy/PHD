# V8: batched fitting with reduced n_iter. Best speed/quality tradeoff so far.
# Reproduces V1 quality within ~1.4 mm MPJPE at ~17x the speed.
#
# All 17 EMDB sequences: ~90 min total, mean MPJPE 63.91 mm,
# Pelvis-Err 81.7 mm (vs cached 131.7 mm).

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 50               # the key knob: was over-fitting at 200
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

# Set --seed via CLI for bit-exact reproduction; leave unset for normal runs.

loss:
  w_smooth: 0.0
  smooth_intra: false
  smooth_intra_weight: 10.0
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false
