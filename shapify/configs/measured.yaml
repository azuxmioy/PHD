subjects:
input_dir: input
output_dir: fit_shape_final

# Camera focal length is required per subject in the subjects JSON. Optional
# per-subject width/height override the image dimensions when needed.

template:
  pose_type: T
  leg_close: false

loss:
  mass_loss_weight: 10.0
  shoulder_loss_weight: 1.0
  height_loss_weight: 100.0
  beta_reg_weight: 0.1

optimizer:
  lr_small: 0.0001
  lr_pitch: 0.001
  lr_z: 0.001
  lr_shape: 0.01
  n_iter: 500
