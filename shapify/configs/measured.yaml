subjects:
input_dir: input
output_dir: fit_shape_final

camera:
  width: 1440
  height: 1920
  focal: 1436.0

template:
  pose_type: T
  leg_close: false

loss:
  mass_loss_weight: 10.0
  shoulder_loss_weight: 1.0
  height_loss_weight: 100.0
  beta_reg_weight: 0.1

optimizer:
  lr_small: 0.0001
  lr_pitch: 0.001
  lr_z: 0.001
  lr_shape: 0.01
  n_iter: 500
