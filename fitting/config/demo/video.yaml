# Video demo fitting defaults.
# CLI arguments override these values.
#
# `w_smooth` is the single weight for consecutive-frame temporal smoothness
# (intra-batch here, since per_frame is false). For sequence-level smoothing,
# run fit_video with --global_smooth (post-fit LBFGS) instead of in-loop terms.

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 200
  n_iter_first:
  per_frame: false

pipeline:
  num_validation_images: 1
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_kp: 10.0
  w_smooth: 20.0
  w_point: 100.0
  smooth_intra: true
  smooth_causal: false
  gmof_sigma: 100.0
  per_frame_loss: false
  hand_loss_weight: 0.2
  hand_pose_reg_weight: 0.0
  point_pose_weight: 1.0
  point_surface_weight: 0.1
  point_update_interval: 10

optimizer:
  lr_cam: 1.0e-3
  lr_pose: 1.0e-3
  lr_orient: 1.0e-3

# Post-fit sequence-level smoother (only runs with --global_smooth). These weight
# the reprojection (w_kp), deviation-from-init (w_reg), and temporal smoothness
# (w_smooth) terms, distinct from the in-loop loss.w_smooth above. head_w extra-
# weights the head keypoints (nose/eyes/ears) so the face pose is pulled harder.
global_smooth:
  iters: 10
  w_kp: 20.0
  w_reg: 5.0
  w_smooth: 20.0
  head_w: 1.0
