# Video demo fitting defaults.
# CLI arguments override these values.

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 200
  n_iter_first:
  per_frame: false

pipeline:
  num_validation_images: 1
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_kp: 10.0
  w_smooth: 1.0
  w_point: 100.0
  smooth_intra: true
  smooth_intra_weight: 10.0
  smooth_causal: true
  w_jitter: 0.2
  w_reg_init: 0.5
  gmof_sigma: 100.0
  per_frame_loss: false
  hand_loss_weight: 0.2
  hand_pose_reg_weight: 0.0
  point_pose_weight: 1.0
  point_surface_weight: 0.1
  point_update_interval: 10

optimizer:
  lr_cam: 1.0e-3
  lr_pose: 1.0e-3
  lr_orient: 1.0e-4
