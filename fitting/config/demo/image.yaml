# Single-image demo fitting defaults.
# CLI arguments override these values.

fit:
  n_sample: 1
  n_iter: 300
  n_iter_first:
  per_frame: false

pipeline:
  num_validation_images: 1
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_kp: 1.0
  w_smooth: 0.0
  w_point: 100.0
  smooth_intra: false
  smooth_causal: false
  gmof_sigma: 0.0
  per_frame_loss: false
  hand_loss_weight: 0.05
  hand_pose_reg_weight: 0.1
  point_pose_weight: 0.0
  point_surface_weight: 0.1
  point_update_interval: 10

optimizer:
  lr_cam: 1.0e-3
  lr_pose: 1.0e-3
  lr_orient: 1.0e-3
