# V4 (heavy smoother): batched setup + smoother-style losses from
# fitting/shared/smoother.py (GMoF reprojection, 2nd-diff jitter on cam/orient/pose
# + 10x head-joint jitter, regularize-toward-init).
#
# Use for demo videos where trajectory smoothness matters more than
# the lowest possible MPJPE.

fit:
  batch_size: 256
  n_sample: 1              # reduce per-frame replicas when running large batches
  n_iter: 50
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 1.0
  smooth_intra: true
  smooth_intra_weight: 10.0
  w_jitter: 0.2
  w_reg_init: 0.5
  gmof_sigma: 100.0        # GMoF-robust 2D keypoint loss
  per_frame_loss: false
