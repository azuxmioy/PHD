# Fast batched EMDB config retained for ablations. Prefer recommended.yaml
# for public benchmark reproduction.

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 50
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 0.0
  smooth_intra: false
  smooth_intra_weight: 10.0
  smooth_causal: false
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false
