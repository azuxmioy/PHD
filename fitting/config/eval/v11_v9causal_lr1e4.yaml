# V11 + V9-causal: lr_pose=1e-4 plus one-way intra-batch smoothness.
# The past frame in each (t-1, t) pair is detach()-ed so smoothness pulls
# only from past->present, never future->past.

fit:
  batch_size: 64
  n_sample: 4
  n_iter: 50
  per_frame: false

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 1.0
  smooth_intra: true
  smooth_intra_weight: 10.0
  smooth_causal: true     # detach past in (t-1, t) difference
  w_jitter: 0.0
  w_reg_init: 0.0
  gmof_sigma: 0.0
  per_frame_loss: false

optimizer:
  lr_cam: 1.0e-3
  lr_pose: 1.0e-4
  lr_orient: 1.0e-5
