# Legacy per-frame EMDB fitting. This chains prev_params frame-to-frame and is
# slow, but it is useful for reproducing the original paper-style setup.

fit:
  batch_size: 64
  n_sample: 4
  per_frame: true

pipeline:
  num_inference_steps: 5
  guidance_scale: 1.5
  use_heatmap: true
  use_vertices: true

loss:
  w_smooth: 0.0
  smooth_intra: false
  smooth_causal: false
  gmof_sigma: 0.0
  per_frame_loss: false
